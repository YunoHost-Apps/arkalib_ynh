#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "arkalib"
name = "ARKALIB"
description.en = "Create and track budgets without requiring advanced accounting knowledge"
description.fr = "Créer et de suivre des budgets sans notion comptable avancée"

version = "2026.10.24~ynh1"

maintainers = []

[upstream]
license = "MIT"
code = "https://github.com/BaptisteCHRPN/arkalib"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/arkalib"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["fr"]
    default = "fr"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/BaptisteCHRPN/arkalib/archive/5c430dfb9d7e5af38ae35210b683f2f7eaf96ec9.tar.gz"
        sha256 = "b10918f606818d4d208032ab128599fca71b4f1ee9f72e73c9b66c2f8b55a9fd"

        autoupdate.strategy = "latest_github_commit"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "php8.5-cli",
        "php8.5-pdo",
        "php8.5-mysql",
        "php8.5-intl",
        "php8.5-mbstring",
        "php8.5-xml",
        "php8.5-fileinfo",
        "mariadb-server",
    ]

    [resources.database]
    type = "mysql"

    [resources.composer]
    version = "2.10.2"
